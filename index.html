<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meus Gastos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
// aplica o tema escolhido antes de desenhar a página, para não piscar claro
try { const t = localStorage.getItem("meus-gastos-tema"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  const c = localStorage.getItem("meus-gastos-cor"); if (c) document.documentElement.dataset.cor = c; } catch(e){}
</script>
<style>
/* Visual no padrão dos apps do iPhone, igual ao Meu Semestre: título grande, listas agrupadas em quadros sobre fundo cinza,
   barra de abas embaixo no celular (pílula flutuante no topo em telas largas). A cor do app é escolhida no botão Aparência (azul do iPhone 14 por padrão). */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --surface-2:#e9e9ee; --line:rgba(60,60,67,.2);
  --fg:#000000; --muted:#6c6c70; --ink:#8e8e93;
  --accent:var(--c-claro); --accent-fill:var(--c-fundo); --accent-ink:#ffffff; --accent-bg:var(--c-claro-bg); --accent-txt:var(--c-claro);
  --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.24);
  --barra:rgba(249,249,249,.82); --folha:#f2f2f7; --campo:#ffffff;
  --ok:#1a7f3c; --warn:#946200; --bad:#c9281e;
  --ok-bg:rgba(52,199,89,.16); --warn-bg:rgba(255,159,10,.18); --bad-bg:rgba(255,59,48,.13);
  --m-ok:#34c759; --m-warn:#ff9f0a; --m-bad:#ff3b30;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --r:14px; --mola:cubic-bezier(.16,1,.3,1);
  /* cor do app (azul é a padrão). Cada cor tem: texto no claro, texto no escuro, fundo de botão e o degradê do quadro principal */
  --c-claro:#2d5f8b; --c-claro-bg:rgba(86,134,178,.16); --c-escuro:#a9c7e2; --c-escuro-bg:rgba(160,190,218,.22); --c-fundo:#3a6c9a;
  --w-1:#c9d9e8; --w-2:#9db6cd; --w-ink:#10263c;
}
:root[data-cor="bordo"]{--c-claro:#8f2440; --c-claro-bg:rgba(143,36,64,.12); --c-escuro:#e8607f; --c-escuro-bg:rgba(232,96,127,.2); --c-fundo:#a12a4a; --w-1:#a42d4d; --w-2:#6f1a31; --w-ink:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --line:rgba(84,84,88,.6);
  --fg:#ffffff; --muted:#98989f; --ink:#8e8e93;
  --accent:var(--c-escuro); --accent-fill:var(--c-fundo); --accent-ink:#ffffff; --accent-bg:var(--c-escuro-bg); --accent-txt:var(--c-escuro);
  --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.36);
  --barra:rgba(22,22,24,.8); --folha:#1c1c1e; --campo:#2c2c2e;
  --ok:#30d158; --warn:#ffb340; --bad:#ff6961;
  --ok-bg:rgba(48,209,88,.18); --warn-bg:rgba(255,159,10,.2); --bad-bg:rgba(255,69,58,.2);
  --m-ok:#30d158; --m-warn:#ff9f0a; --m-bad:#ff453a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --line:rgba(84,84,88,.6);
  --fg:#ffffff; --muted:#98989f; --ink:#8e8e93;
  --accent:var(--c-escuro); --accent-fill:var(--c-fundo); --accent-ink:#ffffff; --accent-bg:var(--c-escuro-bg); --accent-txt:var(--c-escuro);
  --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.36);
  --barra:rgba(22,22,24,.8); --folha:#1c1c1e; --campo:#2c2c2e;
  --ok:#30d158; --warn:#ffb340; --bad:#ff6961;
  --ok-bg:rgba(48,209,88,.18); --warn-bg:rgba(255,159,10,.2); --bad-bg:rgba(255,69,58,.2);
  --m-ok:#30d158; --m-warn:#ff9f0a; --m-bad:#ff453a; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.4;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;scrollbar-color:var(--fill-2) transparent}
::selection{background:var(--accent-bg)}
input,textarea{caret-color:var(--accent)}
svg.i{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,[role=button]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* cabeçalho: data pequena, título grande da aba e ações */
header{padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
/* faixa sólida, da cor do fundo, atrás da hora e da bateria (app instalado no iPhone): o conteúdo rolado some por baixo dela */
body::after{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);z-index:30;pointer-events:none;background:var(--bg)}
.dt{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:32px}
.dt .filter{gap:10px}
/* botões redondos (topo e setas do mês), como os ícones da barra dos apps do iPhone */
button.topo-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;min-width:38px;min-height:38px;padding:0;border:0;border-radius:50%;background:var(--fill);color:var(--accent);cursor:pointer;flex:none}
button.topo-btn:hover{background:var(--fill-2)}
button.topo-btn svg{width:20px;height:20px}
#hoje{font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
h1{font-family:var(--f-display);font-weight:700;font-size:2.125rem;line-height:1.15;letter-spacing:-.022em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.8rem}
#status{text-align:center;margin-block:0;padding-bottom:28px}
.erro{color:var(--bad);font-size:.9rem;font-weight:500;margin:0}

/* abas: pílula flutuante no topo (telas largas) */
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:6;display:flex;gap:2px;width:fit-content;max-width:calc(100% - 32px);margin:10px auto 0;padding:4px;border-radius:999px;
  background:var(--barra);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 0 0 .5px var(--line),0 10px 30px -14px rgba(0,0,0,.35)}
nav a{padding:8px 16px;border-radius:999px;color:var(--fg);text-decoration:none;font-weight:500;font-size:.94rem;white-space:nowrap}
nav a:hover{background:var(--fill)}
nav a[aria-current="page"]{background:var(--accent-fill);color:var(--accent-ink);font-weight:600}
nav svg{display:none}

main{padding-block:16px 28px}
h2{font-family:var(--f-display);font-weight:700;font-size:1.375rem;letter-spacing:-.02em;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:-.02em;margin:0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin-bottom:12px}
.bar>*{min-width:0;max-width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:26px 18px}
.grid2>*{min-width:0}
.col{display:flex;flex-direction:column;gap:26px}
/* seção: o título fica fora e o conteúdo vai dentro do quadro (.grupo), como as listas agrupadas do iPhone */
.sec>.bar{margin:0 4px 8px;min-height:36px}
.grupo{background:var(--surface);border-radius:var(--r);padding:4px 16px;overflow:hidden}
.grupo>.empty,.grupo>.need{padding:12px 0;margin:0}
.grupo>.list{margin-right:-16px}
.grupo>.list>.row{padding-right:16px}
.label{font-size:.8rem;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);font-weight:500}
.num{font-variant-numeric:tabular-nums}
.need{font-size:.84rem;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

button{font:inherit;font-weight:600;font-size:.94rem;letter-spacing:-.01em;cursor:pointer;border:0;border-radius:999px;background:var(--fill);color:var(--accent);padding:7px 14px}
button:hover{background:var(--fill-2)}
button:active{opacity:.6}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent-fill);color:var(--accent-ink)}
button.primary:hover{background:var(--accent-fill);filter:brightness(1.08)}
button.ghost{background:transparent;color:var(--accent);padding:6px 8px;font-weight:400;font-size:1rem}
button.ghost:hover{background:var(--fill)}
button.danger{color:var(--bad)}

.notice{background:var(--surface);border-radius:var(--r);padding:12px 12px 12px 16px;color:var(--muted);font-size:.87rem;margin-bottom:16px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.notice button{flex:none}
.empty{color:var(--muted);font-size:.94rem;padding:8px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;position:relative;min-height:44px}
.row:not(:first-child)::before{content:"";position:absolute;top:0;right:0;left:var(--rec,0px);border-top:.5px solid var(--line)}
.row:has(>.dot){--rec:22px}
.row .grow{flex:1;min-width:0}
.row .t{font-size:1.0625rem;letter-spacing:-.02em;overflow-wrap:anywhere}
.row .m{color:var(--muted);font-size:.84rem;overflow-wrap:anywhere}
.row[data-edit]{cursor:pointer}
.val{font-family:var(--f-num);font-weight:600;font-size:1.0625rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--fill);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
/* barra de progresso do limite: verde, amarelo perto do limite, vermelho quando passa */
.meter{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:3px}
.row .meter{margin-block:6px 4px}

/* troca de mês: setas redondas e o nome do mês */
.mesnav{display:flex;align-items:center;gap:8px;flex:1}
.mesnav h2{min-width:9.5em;text-align:center}
.mesnav h2::first-letter{text-transform:uppercase}
.mesnav .seta{font-size:1.4rem;font-weight:400;line-height:1;padding-bottom:3px}
.voltar{margin:-6px 0 10px -8px}

/* widgets do topo do Painel */
.wg{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin-bottom:26px}
.w{background:var(--surface);border-radius:22px;padding:14px 16px;min-height:112px;display:flex;flex-direction:column;min-width:0;text-align:left;color:var(--fg);font-weight:400;font-size:1rem}
.w>span{display:block}
.w .k{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:.82rem;font-weight:600;color:var(--accent)}
.w .k .ir{margin-left:auto;color:var(--ink);font-weight:400;font-size:1.1rem;line-height:1}
.w .gr{font-family:var(--f-num);font-size:1.5rem;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:auto;padding-top:10px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.w .gr.bad{color:var(--bad)}
.w .p{margin-top:3px;font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.w.tinta{background:linear-gradient(160deg,var(--w-1),var(--w-2));color:var(--w-ink)}
.w.tinta .k,.w.tinta .p{color:var(--w-ink);opacity:.8}
.w.tinta .gr{font-size:2.25rem;line-height:1}
button.w.w{border-radius:22px;padding:14px 16px;background:var(--surface)}
button.w.w:hover{background:var(--surface);filter:brightness(.97)}
.w .meter{margin-top:8px}

/* gasto por dia: uma coluna por dia do mês */
.barras{display:flex;align-items:flex-end;gap:2px;height:96px;margin-top:12px}
.barras i{flex:1;min-width:0;border-radius:3px 3px 0 0;background:var(--accent-fill);opacity:.45}
.barras i.hoje{opacity:1}
.barras i.vazio{background:var(--fill-2);opacity:1}
.eixo{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}

/* cabeçalho de cada dia na lista de gastos */
.dia-h{display:flex;justify-content:space-between;gap:12px;margin:20px 16px 7px;font-size:.8rem;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);font-weight:500}
.dia-h:first-child{margin-top:4px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .t{font-size:1.0625rem;letter-spacing:-.02em;font-weight:600;min-width:0;overflow-wrap:anywhere}
.card .bar .t::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px}
.big{font-family:var(--f-num);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums}
.card .meter{margin-top:0}

/* controle segmentado (Aparência) */
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{border-radius:7px;background:transparent;color:var(--fg);font-weight:500;padding:5px 16px}
.seg button:hover{background:transparent}
.seg button:focus-visible{outline-offset:-2px}
.seg.cheia{display:flex}
.seg.cheia button{flex:1;padding-left:4px;padding-right:4px}
.seg button[aria-pressed="true"],.seg button[aria-pressed="true"]:hover{background:var(--surface);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}

/* formulários: folha */
dialog{border:0;border-radius:14px;background:var(--folha);color:var(--fg);padding:0;width:min(480px,calc(100vw - 32px));max-height:calc(100dvh - 40px);box-shadow:0 24px 60px -20px rgba(0,0,0,.5);overscroll-behavior:contain}
dialog::backdrop{background:rgba(0,0,0,.4)}
/* com uma janela aberta, a página de trás fica parada (a rolagem fica só dentro da janela) */
html:has(dialog[open]){overflow:hidden}
body.travada{position:fixed;left:0;right:0;overflow:hidden}
dialog form{padding:20px 18px 18px;display:flex;flex-direction:column;gap:14px}
dialog h2{font-size:1.25rem}
dialog h2:focus{outline:none}
dialog p{margin:0}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.8rem;font-weight:500;color:var(--muted);padding-left:4px}
input,select{font:inherit;color:var(--fg);background:var(--campo);border:0;border-radius:10px;padding:9px 12px;width:100%}
.bar select{background:var(--surface)}
/* iPhone: campo de data vem mais alto e mais largo que os outros; aqui ficam iguais */
input:not([type=radio]):not([type=file]),select{height:42px}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;line-height:1.4;text-align:left}
input::-webkit-date-and-time-value{text-align:left;margin:0;min-height:1.4em}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.duo>*{min-width:0}
.duo label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches label{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;display:block;padding:0}
.swatches input{position:absolute;opacity:0;width:1px;height:1px}
.swatches input:checked+label{border-color:var(--fg);box-shadow:inset 0 0 0 3px var(--folha)}
.swatches input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.actions .r{display:flex;gap:8px;flex-wrap:wrap}
.actions button{padding:10px 18px}
/* botão de escolher arquivo com a cara do app (o campo de arquivo de verdade fica escondido) */
.field label.arquivo{display:flex;font-size:inherit;margin:0;align-items:center;justify-content:center;min-height:44px;padding:10px 16px;border-radius:999px;background:var(--fill);color:var(--accent);font-weight:600;cursor:pointer;text-align:center}
#bkFile:focus-visible+.arquivo{outline:2px solid var(--accent);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--barra);color:var(--fg);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 0 0 .5px var(--line),0 10px 30px -10px rgba(0,0,0,.35);
  padding:10px 18px;border-radius:999px;font-size:.94rem;font-weight:500;z-index:40;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.toast button{min-height:0!important;padding:0 0 0 12px!important;font-weight:600;background:none}
/* chave de ligar e desligar, como as do iPhone (aba Contas) */
.chave{cursor:pointer}
.chave input[type=checkbox]{-webkit-appearance:none;appearance:none;width:51px!important;height:31px!important;padding:0!important;border-radius:999px;background:var(--fill-2);position:relative;flex:none;cursor:pointer;margin:0}
.chave input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.chave input[type=checkbox]:checked{background:var(--m-ok)}
.chave input[type=checkbox]:checked::after{transform:translateX(20px)}
.conta{margin-bottom:12px}
.filter{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filter select{width:auto;max-width:100%;min-width:0;text-overflow:ellipsis}

/* telas de toque (celular e tablet): alvos maiores para o dedo e texto de 17px nos campos (evita o zoom automático do iPhone) */
@media (pointer:coarse),(max-width:760px){
  button{min-height:44px;padding:10px 16px}
  button.ghost{padding:10px 10px}
  button.topo-btn{width:44px;height:44px;padding:0}
  header button.topo-btn{width:38px;height:38px;min-height:38px}
  .seg button{min-height:36px;padding:6px 18px}
  input,select{font-size:17px;padding:11px 12px}
  input:not([type=radio]):not([type=file]),select{height:46px}
  .swatches label{width:40px;height:40px}
}
/* celular: abas viram a barra de baixo e os formulários sobem como folha */
@media (max-width:700px){
  nav{position:fixed;inset:auto 0 0;top:auto;width:auto;max-width:none;margin:0;gap:0;border-radius:0;box-shadow:0 -.5px 0 var(--line);
    padding:6px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
  nav a,nav a:hover,nav a[aria-current="page"]{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px;background:none;color:var(--muted);font-size:.69rem;font-weight:500;border-radius:8px}
  nav a[aria-current="page"]{color:var(--accent)}
  nav svg{display:block;width:26px;height:26px}
  nav a[aria-current="page"] svg{stroke-width:2.2;fill:var(--accent-bg)}
  .lg{display:none}
  .dt{flex-wrap:wrap;gap:0}
  .dt .filter{flex:1 0 100%;justify-content:flex-end;flex-wrap:nowrap;gap:10px;margin:4px 0 6px}
  #hoje{order:2}
  header{padding-top:calc(env(safe-area-inset-top,0px) + 2px)}
  #status{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .mesnav{gap:4px}
  .mesnav h2{min-width:0;flex:1;font-size:1.2rem}
  button.mais{width:44px;padding:0 0 3px;font-size:1.6rem;font-weight:400;line-height:1;flex:none}
  .wg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .w.tinta{grid-column:1/-1}
  .w .gr{font-size:clamp(1.1rem,5.4vw,1.5rem)}
  .w.tinta .gr{font-size:clamp(1.6rem,8.6vw,2.25rem)}
  .sec>.bar a{padding-block:11px}
  .filtro-linha .filter,.filtro-linha select{width:100%}
  dialog{margin:auto 0 0;width:100%;max-width:100%;border-radius:14px 14px 0 0;max-height:calc(100dvh - 20px - env(safe-area-inset-top,0px))}
  dialog form{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  dialog form::before{content:"";width:36px;height:5px;border-radius:3px;background:var(--fill-2);align-self:center;margin:-12px 0 -4px}
  .actions .r{flex:1}
  .actions .r button{flex:1}
}
@media (prefers-reduced-motion:no-preference){
  button,nav a{transition:background-color .15s,opacity .15s}
  dialog[open]{animation:sobe .4s var(--mola)}
  dialog[open]::backdrop{animation:some .25s ease-out}
  @media (max-width:700px){dialog[open]{animation-name:folha}}
}
@keyframes sobe{from{opacity:0;transform:scale(.96)}}
@keyframes folha{from{transform:translateY(100%)}}
@keyframes some{from{opacity:0}}
</style>
</head>
<body>

<nav id="tabs" aria-label="Seções">
  <a href="#painel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5H12z"/><path d="M15.5 3.2a8.5 8.5 0 0 1 5.3 5.3h-5.3z"/></svg>Painel</a>
  <a href="#gastos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12v17l-3-2-3 2-3-2-3 2z"/><path d="M9.5 8.5h5M9.5 12.5h5"/></svg>Gastos</a>
  <a href="#contas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20h-5v-5H9v5H4z"/></svg>Contas</a>
  <a href="#categorias"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5a1.5 1.5 0 0 1 1.5-1.5h6.2l8.3 8.3a1.5 1.5 0 0 1 0 2.1l-5.6 5.6a1.5 1.5 0 0 1-2.1 0L4 11.7z"/><circle cx="8.5" cy="8.5" r="1.3"/></svg>Categorias</a>
</nav>
<header>
  <div class="wrap">
    <div class="dt"><span id="hoje"></span>
      <div class="filter"><button class="ghost" id="instalar" hidden>Instalar</button><button class="topo-btn" id="tema" aria-label="Aparência" title="Aparência">◐</button><button class="topo-btn" id="bkp" aria-label="Backup" title="Backup"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="4.5" rx="1.2"/><path d="M5 9v9.5a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5V9M10 13h4"/></svg></button></div></div>
    <h1 id="titulo">Painel</h1>
  </div>
</header>

<main class="wrap" id="view"></main>
<p class="wrap sub" id="status">Carregando…</p>

<dialog id="dlg"><form id="frm" method="dialog"></form></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
const CORES = ["#3b6fd8","#d9534f","#2e9e6a","#c58a12","#8a55c9","#d0679d","#1f9bb0","#6b7a8f"];
const COLS = ["categorias","gastos","contas"];
const LS_KEY = "meus-gastos-v1";
const LS_BACKUP = "meus-gastos-backup-em";
const PAGAMENTOS = [["pix","Pix"],["debito","Débito"],["credito","Crédito"],["dinheiro","Dinheiro"],["boleto","Boleto"]];
const FORA_DO_CLAUDE = !window.claude; // site próprio ou arquivo aberto no navegador

// S guarda todos os dados. "apagados" anota o que foi apagado (código do item -> hora), para uma futura sincronização entre aparelhos.
const S = { categorias:[], gastos:[], contas:[], config:{ orcamento:null }, apagados:{} };
let db = null, mode = "carregando";

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// dinheiro digitado: aceita 12,50 · 12.50 · 1.250,00 · 1.250 · 1250
const num = v => { if (v === "" || v == null) return null; if (typeof v === "number") return isFinite(v) ? v : null;
  let s = String(v).trim().replace(/^R\$\s*/,"").replace(/\s/g,"");
  if (s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"");
  if (!/^\d*\.?\d+$/.test(s)) return null;
  return Number(s); };
const brl = n => (n ?? 0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const brl0 = n => (n ?? 0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
// valor dentro de um campo de digitar: 1250,00
const paraCampo = n => num(n) == null ? "" : num(n).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:false});
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const hojeISO = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const mesAtual = () => hojeISO().slice(0,7);
const dataValida = s => /^\d{4}-\d{2}-\d{2}$/.test(s || "");
const fmtData = s => dataValida(s) ? parseD(s).toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"}) : "sem data";
const fmtDia = s => { if (!dataValida(s)) return "Sem data"; const d = Math.round((parseD(hojeISO()) - parseD(s)) / 86400000);
  const t = parseD(s).toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"}); return d === 0 ? "Hoje · " + t : d === 1 ? "Ontem · " + t : t; };
const diasDesde = s => Math.round((parseD(hojeISO()) - parseD(s)) / 86400000);
const cat = id => S.categorias.find(c => c.id === id);
const corOk = c => /^#[0-9a-f]{6}$/i.test(c || "") ? c : "#8e8e93";
const corDe = id => corOk(cat(id)?.cor);
const nomeDe = id => cat(id)?.nome || "Sem categoria";
const rotPag = p => (PAGAMENTOS.find(x => x[0] === p) || [,""])[1];
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
const plural = (n, um, varios) => n + " " + (n === 1 ? um : varios);
// aviso rápido no pé da tela; "acao" é um botão opcional, como Desfazer
function toast(msg, acao, fn){ const t=$("#toast"); t.textContent=msg;
  if (acao){ const b=document.createElement("button"); b.className="ghost"; b.textContent=acao; b.onclick=()=>{ t.hidden=true; fn(); }; t.append(b); }
  t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true, acao ? 5000 : 2200); }
const mesData = m => { const [y,mm] = m.split("-").map(Number); return new Date(y,mm-1,1); };
const mesLabel = m => mesData(m).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
const mesNome = m => mesData(m).toLocaleDateString("pt-BR",{month:"long"});
const mesMais = (m,n) => { const d = mesData(m); d.setMonth(d.getMonth()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };
const diasNoMes = m => { const [y,mm] = m.split("-").map(Number); return new Date(y,mm,0).getDate(); };
// mesma data no mês seguinte (dia 31 vira o último dia quando o mês é mais curto)
const proxMes = s => { const m = mesMais(s.slice(0,7), 1); return m + "-" + String(Math.min(+s.slice(8), diasNoMes(m))).padStart(2,"0"); };
let mes = mesAtual(); // mês mostrado em todas as abas

/* ---------- armazenamento ---------- */
function loadLocal(){
  try { const d = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (d && typeof d === "object"){
      COLS.forEach(c => S[c] = Array.isArray(d[c]) ? d[c] : []);
      S.config = { orcamento:null, ...(d.config || {}) };
      S.apagados = d.apagados && typeof d.apagados === "object" ? d.apagados : {};
    } } catch(e){}
}
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){ toast("Não foi possível salvar neste navegador."); } }

async function salvar(col, id, data){
  if (db) {
    try { id ? await db.collection(col).doc(id).set(data) : await db.collection(col).add(data); }
    catch(e){ toast(e.code === "quota_exceeded" ? "Limite de registros atingido. Apague itens antigos." : "Não foi possível salvar. Tente de novo."); return false; }
  } else {
    const arr = S[col]; const i = id ? arr.findIndex(x => x.id === id) : -1;
    // _t: quando o item mudou pela última vez (uma sincronização usa isso para saber qual versão é a mais nova)
    if (i >= 0) arr[i] = { id, ...data, _t: Date.now() }; else arr.push({ id: id || uid(), ...data, _t: Date.now() });
    saveLocal(); render();
  }
  return true;
}
async function apagar(col, id){
  if (db) { try { await db.collection(col).doc(id).delete(); } catch(e){ toast("Não foi possível apagar."); return; } }
  else {
    S[col] = S[col].filter(x => x.id !== id);
    // anota o que foi apagado, para uma sincronização não trazer o item de volta de outro aparelho
    S.apagados = { ...(S.apagados||{}), [id]: Date.now() };
    saveLocal(); render();
  }
}
async function salvarConfig(c){
  S.config = db ? c : { ...c, _t: Date.now() };
  if (db) { try { await db.doc("config/geral").set(c); } catch(e){ toast("Não foi possível salvar."); } }
  else { saveLocal(); render(); }
}

async function iniciar(){
  let cdb = null;
  try { cdb = await window.claude?.use?.("db"); } catch(e){}
  if (!cdb) {
    mode = "local"; loadLocal();
    $("#status").textContent = "Salvo neste navegador";
    // outra aba do mesmo navegador mudou os dados: recarrega para as duas ficarem iguais
    window.addEventListener("storage", e => { if (e.key === LS_KEY){ loadLocal(); render(); } });
    render(); return;
  }
  db = cdb;
  const timer = setTimeout(() => { $("#status").textContent = "Sem conexão com seus dados ainda…"; }, 10000);
  let pend = new Set([...COLS, "config"]);
  const pronto = (k, snap) => { if (!snap.metadata.fromCache) { pend.delete(k); if (!pend.size){ clearTimeout(timer); $("#status").textContent = "Salvo na sua conta"; } } };
  COLS.forEach(c => db.collection(c).onSnapshot(snap => {
    S[c] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    mode = "nuvem"; pronto(c, snap); render();
  }, () => { clearTimeout(timer); $("#status").textContent = "Erro ao carregar dados"; }));
  db.doc("config/geral").onSnapshot(snap => {
    if (snap.exists) S.config = { orcamento:null, ...snap.data() };
    pronto("config", snap); render();
  }, () => {});
}

/* ---------- cálculos ---------- */
const doMes = m => S.gastos.filter(g => (g.data||"").startsWith(m));
const soma = l => l.reduce((a,g) => a + (num(g.valor) ?? 0), 0);
function resumoCat(id, m){
  const total = soma(doMes(m).filter(g => g.categoriaId === id));
  const lim = num(cat(id)?.orcamento);
  return { total, lim, resta: lim ? lim - total : null };
}
// cor da barra do limite: verde, amarelo a partir de 80% e vermelho quando chega no limite
function corBudget(total, lim){
  const p = total / lim;
  return p >= 1 ? "var(--m-bad)" : p >= .8 ? "var(--m-warn)" : "var(--m-ok)";
}
const pctDe = (total, lim) => lim ? Math.min(100, total / lim * 100) : 0;
const meter = (total, lim) => `<span class="meter" style="display:block"><i style="width:${pctDe(total,lim)}%;background:${corBudget(total,lim)}"></i></span>`;
const textoResta = (resta, lim) => resta > 0 ? `Restam <b class="num">${brl0(resta)}</b> de ${brl0(lim)}`
  : resta === 0 ? `<span class="chip warn">No limite</span> de ${brl0(lim)}`
  : `<span class="chip bad">Passou ${brl0(-resta)}</span> do limite de ${brl0(lim)}`;

// contas da casa: quem divide com você (os nomes ficam em S.config.pessoas) e a parte de cada pessoa
const pessoas = () => { const p = S.config.pessoas; return Array.isArray(p) && p.length ? p.map(String) : ["Amiga 1","Amiga 2"]; };
const parteDe = c => (num(c.valor) ?? 0) / (pessoas().length + 1);
const recebeu = (c, i) => !!(c.recebido || [])[i];

/* ---------- views ---------- */
const svgI = d => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const ICO = {
  carteira: svgI('<path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H17v3"/><path d="M4 7.5V17a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2H6.5A2.5 2.5 0 0 1 4 7.5z"/><path d="M16 13.5h.5"/>'),
  casa: svgI('<path d="M4 11.5 12 4l8 7.5V20h-5v-5H9v5H4z"/>'),
  pagar: svgI('<path d="M12 4v13M7 12l5 5 5-5M5 20h14"/>'),
  receber: svgI('<path d="M12 17V4M7 9l5-5 5 5M5 20h14"/>'),
  alvo: svgI('<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/>'),
  media: svgI('<path d="M4 19h16M7 16v-4M12 16V7M17 16v-6"/>'),
};
// fora do Claude os dados vivem só neste navegador, então lembramos do backup
function marcarBackup(){ try { localStorage.setItem(LS_BACKUP, hojeISO()); } catch(e){} }
function avisoBackup(){
  if (!FORA_DO_CLAUDE || mode !== "local" || !(S.gastos.length || S.contas.length)) return "";
  let ult = null; try { ult = localStorage.getItem(LS_BACKUP); } catch(e){}
  const dias = dataValida(ult) ? diasDesde(ult) : null;
  if (dias != null && dias < 7) return "";
  const msg = dias == null ? "Você ainda não fez backup neste aparelho. Os dados ficam só neste navegador." : `Seu último backup foi há ${dias} dias. Os dados ficam só neste navegador.`;
  return `<div class="notice"><span>${msg}</span><button data-acao="backup">Fazer backup</button></div>`;
}
const vCarregando = () => '<p class="empty">Carregando seus dados…</p>';

// linha de cima das três abas: troca de mês e o botão de criar
function barraMes(novo, rotulo){
  return `<div class="bar"><div class="mesnav"><button class="topo-btn seta" data-mes="-1" aria-label="Mês anterior">‹</button><h2>${esc(mesLabel(mes))}</h2><button class="topo-btn seta" data-mes="1" aria-label="Próximo mês">›</button></div>
    <button class="primary mais" data-novo="${novo}" aria-label="${rotulo}"><span aria-hidden="true">+</span><span class="lg"> ${rotulo.split(" ")[1].replace(/^./, l => l.toUpperCase())}</span></button></div>
    ${mes !== mesAtual() ? '<button class="ghost voltar" data-mes="0">Voltar para o mês atual</button>' : ""}`;
}
const editavel = (col, id) => `data-edit="${col}" data-id="${esc(id)}" role="button" tabindex="0"`;
const linhaGasto = (g, comData) => `<div class="row" ${editavel("gastos", g.id)}><span class="dot" style="background:${corDe(g.categoriaId)}"></span>
  <div class="grow"><div class="t">${esc(g.descricao)}</div>
    <div class="m">${esc(nomeDe(g.categoriaId))}${comData?" · "+fmtData(g.data):""}${g.pagamento?" · "+esc(rotPag(g.pagamento)):""}</div></div>
  <span class="val">${brl(num(g.valor))}</span></div>`;
const maisNovos = (a,b) => (b.data||"").localeCompare(a.data||"") || (b._t||0) - (a._t||0);

function vPainel(){
  const lista = doMes(mes), total = soma(lista), mAnt = mesMais(mes,-1), ant = soma(doMes(mAnt));
  const ehAtual = mes === mesAtual(), nd = diasNoMes(mes), diaHoje = +hojeISO().slice(8);
  const decorridos = ehAtual ? diaHoje : mes < mesAtual() ? nd : 0;
  const media = decorridos ? total / decorridos : null;
  const proj = ehAtual && media != null ? media * nd : null;
  const orc = num(S.config.orcamento);
  let comp = `Sem gastos em ${mesNome(mAnt)} para comparar`;
  if (ant > 0){ const d = Math.round((total - ant) / ant * 100);
    comp = d === 0 ? `Igual a ${mesNome(mAnt)}` : `${Math.abs(d)}% a ${d > 0 ? "mais" : "menos"} que ${mesNome(mAnt)} (${brl0(ant)})`; }

  const widgets = `<div class="wg">
    <div class="w tinta"><span class="k">${ICO.carteira}Gasto no mês</span><span class="gr">${brl(total)}</span><span class="p">${comp}</span></div>
    <button class="w" data-acao="cfg"><span class="k">${ICO.alvo}Orçamento<span class="ir" aria-hidden="true">›</span></span>
      ${orc ? `<span class="gr ${orc-total<0?"bad":""}">${brl0(Math.abs(orc-total))}</span>${meter(total,orc)}<span class="p">${orc-total>=0?"restam de":"acima dos"} ${brl0(orc)}</span>`
            : `<span class="gr">—</span><span class="p">Toque para definir quanto quer gastar no mês</span>`}</button>
    <div class="w"><span class="k">${ICO.media}Média por dia</span><span class="gr">${media!=null?brl(media):"—"}</span>
      <span class="p">${proj!=null?`Nesse ritmo, o mês fecha em ${brl0(proj)}`:plural(lista.length,"lançamento","lançamentos")}</span></div>
  </div>`;

  const cats = S.categorias.map(c => ({c, ...resumoCat(c.id, mes)})).filter(x => x.total || x.lim);
  const sem = soma(lista.filter(g => !cat(g.categoriaId)));
  if (sem) cats.push({ c:{id:"",nome:"Sem categoria",cor:"#8e8e93"}, total:sem, lim:null, resta:null });
  const linhasCat = cats.sort((a,b) => b.total - a.total).map(({c,total:t,lim,resta}) => `<div class="row" ${c.id?`data-acao="vercat" data-id="${esc(c.id)}" role="button" tabindex="0" style="cursor:pointer"`:""}><span class="dot" style="background:${corOk(c.cor)}"></span>
    <div class="grow"><div class="t">${esc(c.nome)}</div>
      ${lim?`${meter(t,lim)}<div class="m">${textoResta(resta,lim)}</div>`:`<div class="m">${total?Math.round(t/total*100)+"% do mês":"Sem limite"}</div>`}</div>
    <span class="val">${brl(t)}</span></div>`).join("");

  const porDia = Array.from({length:nd}, () => 0);
  lista.forEach(g => { const d = +g.data.slice(8); if (d>=1 && d<=nd) porDia[d-1] += num(g.valor) ?? 0; });
  const max = Math.max(...porDia), iMax = porDia.indexOf(max);
  const barras = porDia.map((v,i) => `<i class="${ehAtual&&i+1===diaHoje?"hoje":""} ${v?"":"vazio"}" style="height:${v?Math.max(4,v/max*100):2}%" title="Dia ${i+1}: ${brl(v)}"></i>`).join("");
  const ultimos = [...lista].sort(maisNovos).slice(0,6);

  return `${avisoBackup()}
  ${barraMes("gastos","Novo gasto")}
  ${widgets}
  <div class="grid2">
    <section class="sec"><div class="bar"><h3>Por categoria</h3></div>
      <div class="grupo">${linhasCat?`<div class="list">${linhasCat}</div>`
        :S.categorias.length?'<p class="empty">Nenhum gasto neste mês.</p>':'<p class="empty">Crie suas categorias primeiro, na aba Categorias.</p>'}</div>
    </section>
    <div class="col">
      <section class="sec"><div class="bar"><h3>Gasto por dia</h3></div>
        <div class="grupo"><div class="barras" role="img" aria-label="Gasto por dia em ${esc(mesLabel(mes))}">${barras}</div>
          <div class="eixo"><span>1</span><span>${Math.round(nd/2)}</span><span>${nd}</span></div>
          <p class="need">${max>0?`Dia mais caro: ${iMax+1}, com <b class="num">${brl(max)}</b>`:"Nada lançado neste mês."}</p></div></section>
      <section class="sec"><div class="bar"><h3>Últimos gastos</h3><a href="#gastos">Ver todos</a></div>
        <div class="grupo">${ultimos.length?`<div class="list">${ultimos.map(g => linhaGasto(g, true)).join("")}</div>`:'<p class="empty">Nada lançado neste mês.</p>'}</div></section>
    </div>
  </div>`;
}

let filtroCat = "";
function vGastos(){
  if (filtroCat && !cat(filtroCat)) filtroCat = "";
  const lista = doMes(mes).filter(g => !filtroCat || g.categoriaId === filtroCat).sort(maisNovos);
  const grupos = []; lista.forEach(g => { const u = grupos[grupos.length-1]; if (u && u.data === g.data) u.itens.push(g); else grupos.push({data:g.data, itens:[g]}); });
  return `${avisoBackup()}
  ${barraMes("gastos","Novo gasto")}
  <div class="bar filtro-linha"><div class="filter"><label class="sr" for="fCat">Categoria</label><select id="fCat"><option value="">Todas as categorias</option>${S.categorias.map(c=>`<option value="${esc(c.id)}" ${c.id===filtroCat?"selected":""}>${esc(c.nome)}</option>`).join("")}</select></div>

function vContas(){
  const ps = pessoas(), n = ps.length + 1, hoje = hojeISO();
  const lista = S.contas.filter(c => (c.data||"").startsWith(mes)).sort((a,b) => (a.data||"").localeCompare(b.data||"") || (a._t||0) - (b._t||0));
  const total = soma(lista), abertas = lista.filter(c => !c.paga);
  const aReceber = lista.reduce((a,c) => a + parteDe(c) * ps.filter((_,i) => !recebeu(c,i)).length, 0);
  const widgets = `<div class="wg">
    <div class="w tinta"><span class="k">${ICO.casa}Contas do mês</span><span class="gr">${brl(total)}</span><span class="p">Sua parte: ${brl(total / n)} · dividido por ${n}</span></div>
    <div class="w"><span class="k">${ICO.pagar}Falta pagar</span><span class="gr">${brl(soma(abertas))}</span><span class="p">${abertas.length?plural(abertas.length,"conta","contas"):lista.length?"Tudo pago":"Nenhuma conta"}</span></div>
    <div class="w"><span class="k">${ICO.receber}Falta receber</span><span class="gr">${brl(aReceber)}</span><span class="p">${aReceber>0?"das contas deste mês":lista.length?"Tudo recebido":"Nenhuma conta"}</span></div>
  </div>`;
  const cartoes = lista.map(c => { const tudo = c.paga && ps.every((_,i) => recebeu(c,i));
    const chip = tudo ? ' <span class="chip ok">acertada</span>' : !c.paga && c.data < hoje ? ' <span class="chip bad">vencida</span>' : !c.paga && c.data === hoje ? ' <span class="chip warn">vence hoje</span>' : "";
    return `<div class="grupo conta"><div class="list">
      <div class="row" ${editavel("contas", c.id)}><div class="grow"><div class="t">${esc(c.descricao)}${chip}</div>
        <div class="m">Vence ${fmtData(c.data)} · ${brl(parteDe(c))} para cada</div></div><span class="val">${brl(num(c.valor))}</span></div>
      <label class="row chave"><span class="grow t">Paguei a conta</span><input type="checkbox" data-chk="paga" data-id="${esc(c.id)}" ${c.paga?"checked":""}></label>
      ${ps.map((nome,i) => `<label class="row chave"><span class="grow t">${esc(nome)} me pagou</span><input type="checkbox" data-chk="${i}" data-id="${esc(c.id)}" ${recebeu(c,i)?"checked":""}></label>`).join("")}
    </div></div>`; }).join("");
  // o que cada pessoa ainda deve, somando todos os meses (para uma dívida antiga não sumir ao trocar de mês)
  const deve = ps.map((nome,i) => { const pend = S.contas.filter(c => !recebeu(c,i)); return { nome, qtd:pend.length, total:pend.reduce((a,c) => a + parteDe(c), 0) }; });
  return `${avisoBackup()}
  ${barraMes("contas","Nova conta")}
  ${widgets}
  <div class="grid2">
    <section class="sec"><div class="bar"><h3>Contas</h3></div>
      ${cartoes || '<div class="grupo"><p class="empty">Nenhuma conta com vencimento neste mês. Toque no + para anotar a primeira.</p></div>'}</section>
    <section class="sec"><div class="bar"><h3>Quem te deve</h3><button class="ghost" data-acao="pessoas">Nomes</button></div>
      <div class="grupo"><div class="list">${deve.map(d => `<div class="row"><div class="grow"><div class="t">${esc(d.nome)}</div>
        <div class="m">${d.qtd?plural(d.qtd,"conta em aberto","contas em aberto")+", somando todos os meses":"Tudo acertado"}</div></div><span class="val">${brl(d.total)}</span></div>`).join("")}</div></div></section>
  </div>`;
}

    return `<div class="card" style="--c:${corOk(c.cor)}">

/* ---------- formulários ---------- */
const optCats = () => [["","Sem categoria"], ...S.categorias.map(c => [c.id, c.nome])];
const FORMS = {
  categorias: { titulo:"Nova categoria", editar:"Editar categoria", campos:[
    {k:"nome",l:"Nome",t:"text",req:1,ph:"Ex.: Mercado"},
    {k:"orcamento",l:"Limite mensal (opcional)",t:"num",ph:"Ex.: 600,00",hint:"Mostra quanto ainda dá para gastar nessa categoria no mês."},

  contas: { titulo:"Nova conta", editar:"Editar conta", apagado:"Conta apagada", campos:[
    {k:"descricao",l:"Conta",t:"text",req:1,ph:"Ex.: Luz, Internet, Aluguel"},
    {duo:[{k:"valor",l:"Valor total (R$)",t:"num",ph:"0,00"},{k:"data",l:"Vencimento",t:"date",def:hojeISO}]} ]},

    {duo:[{k:"categoriaId",l:"Categoria",t:"select",opts:optCats},{k:"pagamento",l:"Pagamento",t:"select",opts:PAGAMENTOS,def:"pix"}]} ]},
};

function campoHTML(c, v){
  const id = "f_"+c.k, val = v ?? (typeof c.def==="function"?c.def():c.def) ?? "";
  if (c.t==="select"){ const o = typeof c.opts==="function"?c.opts():c.opts;
    return `<div class="field"><label for="${id}">${c.l}</label><select id="${id}" name="${c.k}">${o.map(([a,b])=>`<option value="${esc(a)}" ${String(val)===String(a)?"selected":""}>${esc(b)}</option>`).join("")}</select></div>`; }
  if (c.t==="cor"){ const cur = CORES.includes(val) ? val : CORES[S.categorias.length % CORES.length];
    return `<div class="field"><span class="label">${c.l}</span><div class="swatches">${CORES.map((h,i)=>`<input type="radio" name="cor" id="cor${i}" value="${h}" ${h===cur?"checked":""}><label for="cor${i}" style="background:${h}" aria-label="Cor ${i+1}"></label>`).join("")}</div></div>`; }
  const ehNum = c.t==="num";
  return `<div class="field"><label for="${id}">${c.l}</label><input id="${id}" name="${c.k}" type="${ehNum?"text":c.t}" ${ehNum?'inputmode="decimal" autocomplete="off"':""} value="${esc(ehNum?paraCampo(val):val)}" ${c.req?"required":""} placeholder="${esc(c.ph||"")}">${c.hint?`<span class="need">${c.hint}</span>`:""}</div>`;
}

function validar(col, out, raw){
  for (const c of FORMS[col].campos.flatMap(c => c.duo || [c]))
    if (c.t==="num" && String(raw[c.k] ?? "").trim() !== "" && out[c.k] == null) return [c.k, `${c.l.split(" (")[0]}: use só números, como 12,50.`];
  if (!String(out[FORMS[col].campos[0].k]).trim()) return [FORMS[col].campos[0].k, "Preencha este campo."];
  if (col==="categorias" && out.orcamento != null && out.orcamento <= 0) return ["orcamento", "O limite precisa ser maior que zero, ou deixe vazio."];
  if (col!=="categorias"){
    if (out.valor == null || out.valor <= 0) return ["valor", "Informe o valor (maior que zero)."];
    if (!dataValida(out.data)) return ["data", "Informe a data."];
  }
  return null;
}
function mostrarErro(campoId, msg){ const e = $("#erro"); e.textContent = msg; e.hidden = false; document.getElementById(campoId)?.focus(); }

function abrirForm(col, id, preset={}){
  const F = FORMS[col], item = id ? S[col].find(x=>x.id===id) : null;
  if (id && !item) return;
  if (col==="gastos" && !S.categorias.length){ toast("Crie uma categoria primeiro."); location.hash="#categorias"; return; }
  const dados = { ...preset, ...(item||{}) };
  const campos = F.campos.map(c => c.duo ? `<div class="duo">${c.duo.map(d=>campoHTML(d,dados[d.k])).join("")}</div>` : campoHTML(c, dados[c.k])).join("");
  const frm = $("#frm");
  frm.innerHTML = `<h2>${id?F.editar:F.titulo}</h2>${campos}
    <p class="erro" id="erro" role="alert" hidden></p>
    <div class="actions">${id?`<div class="r"><button type="button" class="danger" id="del">Excluir</button>${col==="gastos"?'<button type="button" id="dup">Duplicar</button>':col==="contas"?'<button type="button" id="dup">Repetir no mês seguinte</button>':""}</div>`:"<span></span>"}
      <div class="r"><button type="button" id="cancel">Cancelar</button><button type="submit" class="primary">Salvar</button></div></div>`;
  frm.noValidate = true;
  frm.onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(frm), out = {}, raw = {};
    F.campos.flatMap(c => c.duo || [c]).forEach(c => { let v = fd.get(c.k) ?? ""; raw[c.k] = v; if (c.t==="num"){ v = num(v); if (v != null) v = Math.round(v * 100) / 100; } else if (c.t==="text") v = String(v).trim(); out[c.k] = v; });
    const erro = validar(col, out, raw);
    if (erro){ mostrarErro("f_"+erro[0], erro[1]); return; }
    // mantém os campos que o formulário não mostra
    const { id:_, _t, ...resto } = item || {};
    const ok = await salvar(col, id, { ...resto, ...out });
    if (ok){ if (out.data) mes = out.data.slice(0,7); $("#dlg").close(); toast("Salvo"); render(); }
  };
  $("#cancel").onclick = () => $("#dlg").close();
  const del = $("#del");
  // apagar uma categoria leva junto os gastos dela
  const deps = col==="categorias" ? S.gastos.filter(x => x.categoriaId === id).map(x => ["gastos", x.id]) : [];
  // duplicar: abre um item novo já preenchido (gasto com a data de hoje; conta com o vencimento no mês seguinte, sem nada marcado)
  if ($("#dup")) $("#dup").onclick = () => { const { id:_, _t, paga, recebido, ...resto } = item; $("#dlg").close();
    abrirForm(col, null, { ...resto, data: col==="contas" && dataValida(item.data) ? proxMes(item.data) : hojeISO() }); };
  if (del) del.onclick = async () => {
    // gasto e conta: apaga na hora e oferece Desfazer. Categoria pede confirmação, porque leva os gastos junto.
    if (col!=="categorias"){ const { id:_, _t, ...resto } = item;
      await apagar(col, id); $("#dlg").close(); toast(F.apagado, "Desfazer", () => salvar(col, id, resto)); return; }
    if (del.dataset.arm){
      del.disabled = true;
      for (const [c, i] of deps) await apagar(c, i);
      await apagar(col, id); $("#dlg").close(); toast("Excluído"); return;
    }
    del.dataset.arm = 1;
    del.textContent = deps.length ? `Confirmar: apaga também ${plural(deps.length,"gasto","gastos")}` : "Confirmar exclusão";
    setTimeout(() => { if (del.isConnected){ delete del.dataset.arm; del.textContent = "Excluir"; } }, 3500);
  };
  $("#dlg").showModal();
}

/* ---------- backup ---------- */
async function baixarBackup(){
  const data = JSON.stringify({ app:"meus-gastos", versao:1, feitoEm:new Date().toISOString(), ...Object.fromEntries(COLS.map(c=>[c,S[c]])), config:S.config, apagados:S.apagados||{} }, null, 2);
  const nome = "meus-gastos-"+hojeISO()+".json";
  if (FORA_DO_CLAUDE){
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type:"application/json" }));
    a.download = nome; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    marcarBackup(); render(); toast("Backup baixado"); return;
  }
  const dl = await window.claude?.use?.("downloads").catch(()=>null);
  if (!dl){ try { await navigator.clipboard.writeText(data); toast("Backup copiado. Cole num arquivo .json"); } catch(e){ toast("Não foi possível baixar aqui."); } return; }
  try { await dl.save({ filename:nome, data }); toast("Backup salvo"); }
  catch(e){ if (e.code!=="declined") toast("Não foi possível salvar o arquivo."); }
}
function abrirBackup(){
  const frm = $("#frm");
  frm.innerHTML = `<h2 tabindex="-1" autofocus>Backup dos seus dados</h2>
    <p class="need">Baixe um arquivo com categorias, gastos, contas da casa e orçamento. Guarde no seu computador ou Drive. Para restaurar, ou passar para outro aparelho, importe o arquivo aqui.</p>
    <button type="button" class="primary" id="bkDown">Baixar backup (.json)</button>
    <div class="field"><label for="bkFile">Importar backup</label>
      <input type="file" id="bkFile" class="sr" accept=".json,application/json">
      <label for="bkFile" class="arquivo">Escolher arquivo de backup…</label>
      <span class="need">Junta com o que já existe; itens com o mesmo código são substituídos.</span></div>
    <div class="actions"><span></span><div class="r"><button type="button" id="cancel">Fechar</button></div></div>`;
  frm.onsubmit = e => e.preventDefault();
  $("#cancel").onclick = () => $("#dlg").close();
  $("#bkDown").onclick = baixarBackup;
  $("#bkFile").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = async () => {
      let d; try { d = JSON.parse(rd.result); } catch(_){ d = null; }
      if (!d || d.app!=="meus-gastos"){ toast("Arquivo inválido: não é um backup do Meus Gastos."); return; }
      let n = 0;
      for (const c of COLS) for (const x of (Array.isArray(d[c]) ? d[c] : [])) {
        if (!x || typeof x !== "object" || !x.id) continue;
        const { id, _t, ...resto } = x;
        if (await salvar(c, String(id), resto)) n++;
      }
      // orçamento e nomes: só entram se este aparelho ainda não tiver os dele
      const cfg = {};
      if (num(d.config?.orcamento) != null && num(S.config.orcamento) == null) cfg.orcamento = num(d.config.orcamento);
      if (Array.isArray(d.config?.pessoas) && d.config.pessoas.length && !S.config.pessoas) cfg.pessoas = d.config.pessoas.map(String).slice(0, 8);
      if (Object.keys(cfg).length) await salvarConfig({ ...S.config, ...cfg });
      marcarBackup(); render();
      $("#dlg").close(); toast(plural(n,"item importado","itens importados"));
    };
    rd.readAsText(f);
  };
  $("#dlg").showModal();
}

/* ---------- render e rotas ---------- */
const TITULOS = { painel:"Painel", gastos:"Gastos", contas:"Contas da casa", categorias:"Categorias" };
const VIEWS = { painel:vPainel, gastos:vGastos, contas:vContas, categorias:vCategorias };
function rota(){ const h = location.hash.slice(1); return VIEWS[h] ? h : "painel"; }
let renderPend = false;
function render(){
  if (renderPend) return; renderPend = true;
  requestAnimationFrame(() => {
    renderPend = false;
    const r = rota();
    document.querySelectorAll("#tabs a").forEach(a => { if (a.getAttribute("href")==="#"+r) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
    $("#titulo").textContent = TITULOS[r];
    $("#view").innerHTML = mode==="carregando" ? vCarregando() : VIEWS[r]();
  });
}

$("#view").addEventListener("click", e => {
  const b = e.target.closest("[data-mes],[data-novo],[data-edit],[data-acao]"); if (!b) return;
  if (b.dataset.mes != null){ const n = +b.dataset.mes; mes = n ? mesMais(mes, n) : mesAtual(); render(); }
  else if (b.dataset.novo) abrirForm(b.dataset.novo, null, b.dataset.novo==="gastos" && filtroCat && rota()==="gastos" ? { categoriaId:filtroCat } : {});
  else if (b.dataset.edit) abrirForm(b.dataset.edit, b.dataset.id);
  else if (b.dataset.acao==="cfg") abrirConfig();
  else if (b.dataset.acao==="backup") abrirBackup();
  else if (b.dataset.acao==="pessoas") abrirPessoas();
  else if (b.dataset.acao==="vercat"){ filtroCat = b.dataset.id; location.hash = "#gastos"; }
});
// no teclado, Enter ou espaço numa linha da lista faz o mesmo que o toque
$("#view").addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"]')){ e.preventDefault(); e.target.click(); }
});
$("#view").addEventListener("change", e => {
  const t = e.target;
  if (t.id==="fCat"){ filtroCat = t.value; render(); }
  else if (t.dataset.chk){ // chaves da aba Contas: "Paguei a conta" e "Fulana me pagou"
    const c = S.contas.find(x => x.id === t.dataset.id); if (!c) return;
    const { id, _t, ...resto } = c;
    if (t.dataset.chk === "paga") resto.paga = t.checked;
    else { const rec = pessoas().map((_,i) => recebeu(c,i)); rec[+t.dataset.chk] = t.checked; resto.recebido = rec; }
    salvar("contas", id, resto);
  }
});
window.addEventListener("hashchange", () => { scrollTo(0, 0); render(); });
$("#bkp").onclick = abrirBackup;

// Trava a rolagem da página enquanto a janela (#dlg) está aberta. No iPhone, só esconder a barra
// de rolagem não basta: a página é "presa" no lugar e volta para a mesma posição ao fechar.
{
  let posicao = 0;
  new MutationObserver(() => {
    const aberto = $("#dlg").open, body = document.body;
    if (aberto && !body.classList.contains("travada")){
      posicao = scrollY; body.style.top = -posicao + "px"; body.classList.add("travada");
    } else if (!aberto && body.classList.contains("travada")){
      body.classList.remove("travada"); body.style.top = ""; scrollTo(0, posicao);
    }
  }).observe($("#dlg"), { attributes:true, attributeFilter:["open"] });
}

// Para criar uma cor nova: um bloco :root[data-cor="..."] no CSS e uma linha aqui.
const LS_COR = "meus-gastos-cor", CORES_APP = [["", "Azul", "#7fa3c4"], ["bordo", "Bordô", "#8f2440"]];
let tema = "", corApp = ""; try { tema = localStorage.getItem(LS_TEMA) || ""; corApp = localStorage.getItem(LS_COR) || ""; } catch(e){}
if (!CORES_APP.some(c => c[0] === corApp)) corApp = "";
const corBarra = document.querySelectorAll('meta[name="theme-color"]'), corOriginal = [...corBarra].map(m => m.content);
function aplicarTema(){
  const [valor, nome, icone] = TEMAS.find(t => t[0] === tema) || TEMAS[0];
  if (valor) document.documentElement.dataset.theme = valor;
  else if (FORA_DO_CLAUDE) delete document.documentElement.dataset.theme;
  if (corApp) document.documentElement.dataset.cor = corApp; else delete document.documentElement.dataset.cor;
  // cor da barra do navegador e do app instalado
  corBarra.forEach((m, i) => m.content = valor ? (valor === "dark" ? "#000000" : "#f2f2f7") : corOriginal[i]);
  $("#tema").innerHTML = icone;
  return nome;
}
function guardar(chave, valor){ try { valor ? localStorage.setItem(chave, valor) : localStorage.removeItem(chave); } catch(e){} }
function abrirAparencia(){
  const frm = $("#frm");
  frm.innerHTML = `<h2 tabindex="-1" autofocus>Aparência</h2>
    <div class="field"><span class="label">Tema</span><div class="seg cheia" id="ap_tema">${TEMAS.map(t => `<button type="button" data-v="${t[0]}">${t[1]}</button>`).join("")}</div></div>
    <div class="field"><span class="label">Cor do app: <span id="ap_nome"></span></span><div class="swatches">${CORES_APP.map((c, i) =>
      `<input type="radio" name="ap_cor" id="ap_cor${i}" value="${c[0]}"><label for="ap_cor${i}" style="background:${c[2]}" title="${c[1]}" aria-label="${c[1]}"></label>`).join("")}</div></div>
    <p class="need">A escolha vale só neste aparelho. Dá para trocar quando quiser.</p>
    <div class="actions"><div class="r" style="flex:1"><button class="primary" type="button" id="cancel" style="flex:1">Pronto</button></div></div>`;
  const marcar = () => {
    frm.querySelectorAll("#ap_tema button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === tema));
    frm.querySelectorAll('[name="ap_cor"]').forEach(r => r.checked = r.value === corApp);
    $("#ap_nome").textContent = (CORES_APP.find(c => c[0] === corApp) || CORES_APP[0])[1];
  };
  frm.querySelectorAll("#ap_tema button").forEach(b => b.onclick = () => { tema = b.dataset.v; guardar(LS_TEMA, tema); aplicarTema(); marcar(); });
  frm.querySelectorAll('[name="ap_cor"]').forEach(r => r.onchange = () => { corApp = r.value; guardar(LS_COR, corApp); aplicarTema(); marcar(); });
  $("#cancel").onclick = () => $("#dlg").close();
  frm.onsubmit = e => e.preventDefault();
  marcar();
  $("#dlg").showModal();
}
$("#tema").onclick = abrirAparencia;
aplicarTema();

/* ---------- modo aplicativo ---------- */
// Só no site hospedado (http/https): liga o manifesto (nome e ícone do app) e o service worker (abre sem internet).
// Aberto direto do arquivo ou dentro do Claude, nada disso é usado.
if (FORA_DO_CLAUDE && location.protocol.startsWith("http")){
  [["manifest","manifest.webmanifest"],["apple-touch-icon","apple-touch-icon.png"],["icon","icon-192.png"]].forEach(([rel, href]) => {
    const l = document.createElement("link"); l.rel = rel; l.href = href; document.head.append(l); });
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  // Android e computador: o navegador avisa quando dá para instalar, e mostramos o botão "Instalar"
  let pedido = null;
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); pedido = e; $("#instalar").hidden = false; });
  window.addEventListener("appinstalled", () => { pedido = null; $("#instalar").hidden = true; toast("App instalado"); });
  $("#instalar").onclick = async () => { if (!pedido) return; pedido.prompt(); await pedido.userChoice.catch(() => {}); pedido = null; $("#instalar").hidden = true; };
}

$("#hoje").textContent = new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
render();
iniciar();
})();
</script>
